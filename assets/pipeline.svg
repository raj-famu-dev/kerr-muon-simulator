<svg viewBox="0 0 900 340" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Engine pipeline from config to plots" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs><radialGradient id="bg" cx="50%" cy="50%" r="80%"><stop offset="0%" stop-color="#1b1033"/><stop offset="100%" stop-color="#05030c"/></radialGradient><linearGradient id="title" x1="0" x2="1"><stop offset="0%" stop-color="#ffd27a"/><stop offset="50%" stop-color="#ff7a18"/><stop offset="100%" stop-color="#c04bff"/></linearGradient><marker id="arrL" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9aa4ff"/></marker><marker id="arrO" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#ff9d2e"/></marker><marker id="arrC" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6ee7ff"/></marker></defs>
<rect width="900" height="340" fill="url(#bg)"/>
<g fill="#fff"><circle cx="482" cy="321" r="1.2"><animate attributeName="opacity" values="1;0.1;1" dur="3.3s" repeatCount="indefinite"/></circle><circle cx="198" cy="11" r="1.2"><animate attributeName="opacity" values="1;0.3;1" dur="4.0s" repeatCount="indefinite"/></circle><circle cx="90" cy="179" r="0.8"><animate attributeName="opacity" values="1;0.1;1" dur="4.0s" repeatCount="indefinite"/></circle><circle cx="728" cy="239" r="1.4"><animate attributeName="opacity" values="1;0.1;1" dur="2.8s" repeatCount="indefinite"/></circle><circle cx="251" cy="34" r="0.8"><animate attributeName="opacity" values="1;0.3;1" dur="2.8s" repeatCount="indefinite"/></circle><circle cx="612" cy="40" r="1.4"><animate attributeName="opacity" values="1;0.2;1" dur="2.2s" repeatCount="indefinite"/></circle><circle cx="217" cy="122" r="1.4"><animate attributeName="opacity" values="1;0.2;1" dur="2.2s" repeatCount="indefinite"/></circle><circle cx="222" cy="211" r="1.2"><animate attributeName="opacity" values="1;0.1;1" dur="3.3s" repeatCount="indefinite"/></circle><circle cx="212" cy="10" r="1.4"><animate attributeName="opacity" values="1;0.2;1" dur="2.2s" repeatCount="indefinite"/></circle><circle cx="874" cy="259" r="1"><animate attributeName="opacity" values="1;0.1;1" dur="2.2s" repeatCount="indefinite"/></circle><circle cx="442" cy="65" r="0.8"><animate attributeName="opacity" values="1;0.3;1" dur="2.2s" repeatCount="indefinite"/></circle><circle cx="210" cy="111" r="1.2"><animate attributeName="opacity" values="1;0.1;1" dur="2.2s" repeatCount="indefinite"/></circle><circle cx="144" cy="284" r="0.8"><animate attributeName="opacity" values="1;0.3;1" dur="2.2s" repeatCount="indefinite"/></circle><circle cx="516" cy="283" r="1"><animate attributeName="opacity" values="1;0.1;1" dur="4.0s" repeatCount="indefinite"/></circle><circle cx="415" cy="106" r="0.8"><animate attributeName="opacity" values="1;0.1;1" dur="2.8s" repeatCount="indefinite"/></circle><circle cx="631" cy="29" r="0.8"><animate attributeName="opacity" values="1;0.3;1" dur="3.3s" repeatCount="indefinite"/></circle><circle cx="707" cy="318" r="1"><animate attributeName="opacity" values="1;0.3;1" dur="3.3s" repeatCount="indefinite"/></circle><circle cx="597" cy="25" r="0.8"><animate attributeName="opacity" values="1;0.1;1" dur="4.0s" repeatCount="indefinite"/></circle><circle cx="173" cy="320" r="0.8"><animate attributeName="opacity" values="1;0.3;1" dur="3.3s" repeatCount="indefinite"/></circle><circle cx="542" cy="310" r="0.8"><animate attributeName="opacity" values="1;0.1;1" dur="3.3s" repeatCount="indefinite"/></circle><circle cx="892" cy="307" r="1.2"><animate attributeName="opacity" values="1;0.1;1" dur="4.0s" repeatCount="indefinite"/></circle><circle cx="419" cy="109" r="0.8"><animate attributeName="opacity" values="1;0.3;1" dur="4.0s" repeatCount="indefinite"/></circle><circle cx="344" cy="8" r="1.4"><animate attributeName="opacity" values="1;0.1;1" dur="2.2s" repeatCount="indefinite"/></circle><circle cx="235" cy="235" r="1.2"><animate attributeName="opacity" values="1;0.1;1" dur="3.3s" repeatCount="indefinite"/></circle><circle cx="322" cy="330" r="1.2"><animate attributeName="opacity" values="1;0.3;1" dur="2.2s" repeatCount="indefinite"/></circle></g>
<text x="16" y="36" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="20" fill="url(#title)" font-weight="bold" text-anchor="start" >Engine pipeline</text>
<rect x="16" y="110" width="118" height="90" rx="12" fill="#9aa4ff" fill-opacity="0.10" stroke="#9aa4ff" stroke-width="2"/>
<text x="75" y="140" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#ffffff" font-weight="bold" text-anchor="middle" >Config / CLI</text>
<text x="75" y="162" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#cfd3ff" font-weight="normal" text-anchor="middle" >a, r0, mass</text>
<text x="75" y="180" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#cfd3ff" font-weight="normal" text-anchor="middle" >direction, dτ</text>
<line x1="137" y1="155" x2="163" y2="155" stroke="#9aa4ff" stroke-width="2" marker-end="url(#arrL)"/>
<rect x="166" y="110" width="118" height="90" rx="12" fill="#ffb347" fill-opacity="0.10" stroke="#ffb347" stroke-width="2"/>
<text x="225" y="140" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#ffffff" font-weight="bold" text-anchor="middle" >Launcher</text>
<text x="225" y="162" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#cfd3ff" font-weight="normal" text-anchor="middle" >E, L from orbit</text>
<text x="225" y="180" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#cfd3ff" font-weight="normal" text-anchor="middle" >initial dr/dτ</text>
<line x1="287" y1="155" x2="313" y2="155" stroke="#9aa4ff" stroke-width="2" marker-end="url(#arrL)"/>
<rect x="316" y="110" width="118" height="90" rx="12" fill="#ff7a18" fill-opacity="0.10" stroke="#ff7a18" stroke-width="2"/>
<text x="375" y="140" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#ffffff" font-weight="bold" text-anchor="middle" >RK4 Integrator</text>
<text x="375" y="162" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#cfd3ff" font-weight="normal" text-anchor="middle" >4 samples / step</text>
<text x="375" y="180" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#cfd3ff" font-weight="normal" text-anchor="middle" >adaptive near r₊</text>
<line x1="437" y1="155" x2="463" y2="155" stroke="#9aa4ff" stroke-width="2" marker-end="url(#arrL)"/>
<rect x="466" y="110" width="118" height="90" rx="12" fill="#c04bff" fill-opacity="0.10" stroke="#c04bff" stroke-width="2"/>
<text x="525" y="140" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#ffffff" font-weight="bold" text-anchor="middle" >Stop check</text>
<text x="525" y="162" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#cfd3ff" font-weight="normal" text-anchor="middle" >r ≤ r₊ + ε</text>
<text x="525" y="180" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#cfd3ff" font-weight="normal" text-anchor="middle" >or τ ≥ τmax</text>
<line x1="587" y1="155" x2="613" y2="155" stroke="#9aa4ff" stroke-width="2" marker-end="url(#arrL)"/>
<rect x="616" y="110" width="118" height="90" rx="12" fill="#3ddc97" fill-opacity="0.10" stroke="#3ddc97" stroke-width="2"/>
<text x="675" y="140" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#ffffff" font-weight="bold" text-anchor="middle" >CSV Writer</text>
<text x="675" y="162" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#cfd3ff" font-weight="normal" text-anchor="middle" >every frame</text>
<text x="675" y="180" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#cfd3ff" font-weight="normal" text-anchor="middle" >t, r, φ, τ, dr/dτ</text>
<line x1="737" y1="155" x2="763" y2="155" stroke="#9aa4ff" stroke-width="2" marker-end="url(#arrL)"/>
<rect x="766" y="110" width="118" height="90" rx="12" fill="#6ee7ff" fill-opacity="0.10" stroke="#6ee7ff" stroke-width="2"/>
<text x="825" y="140" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#ffffff" font-weight="bold" text-anchor="middle" >Python</text>
<text x="825" y="162" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#cfd3ff" font-weight="normal" text-anchor="middle" >Matplotlib plots</text>
<text x="825" y="180" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#cfd3ff" font-weight="normal" text-anchor="middle" >GIF animation</text>
<path id="loop" d="M525,110 C525,54 375,54 375,110" fill="none" stroke="#ff9d2e" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#arrO)"/>
<text x="450" y="48" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#ffb347" font-weight="normal" text-anchor="middle" >repeat while still outside the horizon</text>
<circle r="4.5" fill="#ff9d2e"><animateMotion dur="2s" repeatCount="indefinite"><mpath href="#loop"/></animateMotion></circle>
<line x1="375" y1="200" x2="375" y2="232" stroke="#ff7a18" stroke-width="2" marker-start="url(#arrO)" marker-end="url(#arrO)"/>
<rect x="290" y="232" width="170" height="48" rx="10" fill="#ff7a18" fill-opacity="0.10" stroke="#ff7a18" stroke-width="1.5"/>
<text x="375" y="252" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" fill="#ffffff" font-weight="bold" text-anchor="middle" >Kerr geodesic equations</text>
<text x="375" y="270" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#cfd3ff" font-weight="normal" text-anchor="middle" >dt/dτ  dφ/dτ  d²r/dτ²</text>
<path id="flow" d="M16,155 L884,155" fill="none"/>
<circle r="5" fill="#6ee7ff"><animateMotion dur="7s" repeatCount="indefinite"><mpath href="#flow"/></animateMotion></circle>
<line x1="16" y1="304" x2="734" y2="304" stroke="#ff9d2e" stroke-width="3" stroke-linecap="round"/>
<line x1="766" y1="304" x2="884" y2="304" stroke="#6ee7ff" stroke-width="3" stroke-linecap="round"/>
<text x="375" y="326" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#ffb347" font-weight="normal" text-anchor="middle" >C++ engine · Phases 1 and 2</text>
<text x="825" y="326" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#6ee7ff" font-weight="normal" text-anchor="middle" >Phase 3</text>
</svg>
