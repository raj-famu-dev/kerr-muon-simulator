</g>
<circle cx="100" cy="240" r="6" fill="#ff9d2e"/>
<text x="84" y="232" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#ffb347" font-weight="bold" text-anchor="end" >y_n</text>
<text x="20" y="30" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="22" fill="url(#title)" font-weight="bold" text-anchor="start" >RK4: four slope samples per step</text>
<text x="655" y="120" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" fill="#ffd27a" font-weight="normal" text-anchor="start" >k1 = f(x, y)</text>
<text x="655" y="146" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" fill="#3ddc97" font-weight="normal" text-anchor="start" >k2 = f(x+h/2, y+h/2·k1)</text>
<text x="655" y="172" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" fill="#6ee7ff" font-weight="normal" text-anchor="start" >k3 = f(x+h/2, y+h/2·k2)</text>
<text x="655" y="198" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" fill="#ff7a8a" font-weight="normal" text-anchor="start" >k4 = f(x+h,   y+h·k3)</text>
<text x="655" y="232" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" fill="#e3b8ff" font-weight="normal" text-anchor="start" >y_n+1 = y_n + h/6 ·</text>
<text x="655" y="250" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" fill="#e3b8ff" font-weight="normal" text-anchor="start" >  (k1 + 2k2 + 2k3 + k4)</text>
<text x="655" y="296" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#ffffff" font-weight="bold" text-anchor="start" >In this engine:</text>
<text x="655" y="316" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#b9b3d9" font-weight="normal" text-anchor="start" >x → τ  (proper time)</text>
<text x="655" y="334" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#b9b3d9" font-weight="normal" text-anchor="start" >y → [t, r, φ, dr/dτ]</text>
<text x="655" y="352" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#b9b3d9" font-weight="normal" text-anchor="start" >h → dτ  (step size)</text>
</svg>
