<svg viewBox="0 0 900 320" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Project Monograph: Simulating Spacetime" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="75%">
      <stop offset="0%" stop-color="#1b1033"/>
      <stop offset="100%" stop-color="#05030c"/>
    </radialGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="55%" stop-color="#ff9d2e" stop-opacity="0"/>
      <stop offset="75%" stop-color="#ff7a18" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#ff7a18" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="title" x1="0" x2="1">
      <stop offset="0%" stop-color="#ffd27a"/>
      <stop offset="50%" stop-color="#ff7a18"/>
      <stop offset="100%" stop-color="#c04bff"/>
    </linearGradient>
  </defs>
  <rect width="900" height="320" fill="url(#bg)"/>

  <!-- twinkling stars -->
  <g fill="#fff">
    <circle cx="60" cy="40" r="1.4"><animate attributeName="opacity" values="1;0.2;1" dur="3s" repeatCount="indefinite"/></circle>
    <circle cx="140" cy="250" r="1"><animate attributeName="opacity" values="0.3;1;0.3" dur="2.4s" repeatCount="indefinite"/></circle>
    <circle cx="230" cy="90" r="1.2"><animate attributeName="opacity" values="1;0.1;1" dur="4s" repeatCount="indefinite"/></circle>
    <circle cx="310" cy="285" r="1.3"><animate attributeName="opacity" values="0.2;1;0.2" dur="3.3s" repeatCount="indefinite"/></circle>
    <circle cx="520" cy="30" r="1"><animate attributeName="opacity" values="1;0.3;1" dur="2.8s" repeatCount="indefinite"/></circle>
    <circle cx="640" cy="270" r="1.4"><animate attributeName="opacity" values="0.4;1;0.4" dur="3.7s" repeatCount="indefinite"/></circle>
    <circle cx="760" cy="60" r="1.2"><animate attributeName="opacity" values="1;0.2;1" dur="2.2s" repeatCount="indefinite"/></circle>
    <circle cx="850" cy="200" r="1"><animate attributeName="opacity" values="0.2;1;0.2" dur="3.1s" repeatCount="indefinite"/></circle>
    <circle cx="90" cy="150" r="0.9"><animate attributeName="opacity" values="1;0.2;1" dur="4.2s" repeatCount="indefinite"/></circle>
    <circle cx="470" cy="300" r="1"><animate attributeName="opacity" values="0.3;1;0.3" dur="2.6s" repeatCount="indefinite"/></circle>
  </g>

  <!-- black hole, positioned right -->
  <g transform="translate(700,160)">
    <circle r="110" fill="url(#glow)"/>
    <!-- frame-dragged accretion rings -->
    <g fill="none" stroke-linecap="round">
      <ellipse rx="105" ry="24" stroke="#ffb347" stroke-width="3" stroke-dasharray="40 25" opacity="0.9">
        <animate attributeName="stroke-dashoffset" from="0" to="-130" dur="3s" repeatCount="indefinite"/>
      </ellipse>
      <ellipse rx="82" ry="18" stroke="#ff7a18" stroke-width="3" stroke-dasharray="30 18" opacity="0.9">
        <animate attributeName="stroke-dashoffset" from="0" to="-96" dur="2s" repeatCount="indefinite"/>
      </ellipse>
      <ellipse rx="60" ry="13" stroke="#ff4d6d" stroke-width="2.5" stroke-dasharray="22 12" opacity="0.9">
        <animate attributeName="stroke-dashoffset" from="0" to="-68" dur="1.2s" repeatCount="indefinite"/>
      </ellipse>
    </g>
    <circle r="30" fill="#000" stroke="#c04bff" stroke-width="1.5" opacity="1"/>
    <circle r="30" fill="none" stroke="#fff" stroke-opacity="0.35" stroke-width="0.8">
      <animate attributeName="r" values="30;38;30" dur="4s" repeatCount="indefinite"/>
      <animate attributeName="stroke-opacity" values="0.4;0;0.4" dur="4s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- muon plunging in a spiral -->
  <path id="plunge" d="M 450,40 C 540,10 640,60 660,120 C 680,190 735,205 750,165 C 758,135 720,125 705,150 C 698,163 710,168 700,160"
        fill="none" stroke="#6ee7ff" stroke-opacity="0.35" stroke-width="1.5" stroke-dasharray="4 5"/>
  <circle r="5" fill="#6ee7ff">
    <animateMotion dur="7s" repeatCount="indefinite" rotate="auto"><mpath href="#plunge"/></animateMotion>
    <animate attributeName="opacity" values="1;1;1;0" keyTimes="0;0.8;0.95;1" dur="7s" repeatCount="indefinite"/>
  </circle>
  <circle r="10" fill="none" stroke="#6ee7ff" stroke-opacity="0.5">
    <animateMotion dur="7s" repeatCount="indefinite"><mpath href="#plunge"/></animateMotion>
    <animate attributeName="r" values="5;11;5" dur="1s" repeatCount="indefinite"/>
  </circle>
  <text font-family="monospace" font-size="11" fill="#6ee7ff" x="440" y="30">μ⁻  τ = 2.2 μs</text>

  <!-- title -->
  <text x="40" y="130" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="46" font-weight="700" fill="url(#title)">Simulating Spacetime</text>
  <text x="42" y="165" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="18" fill="#e8e0ff">A Relativistic Physics Engine for Kerr Black Holes</text>
  <text x="42" y="200" font-family="monospace" font-size="14" fill="#9aa4ff">C++17  ·  RK4  ·  Frame Dragging  ·  Python</text>
  <text x="42" y="240" font-family="monospace" font-size="13" fill="#ffd27a">dt/dτ → ∞   while   τ stays finite</text>
</svg>
